<main id="main"><article class="wrap article-wrap"><p class="club-kicker">跑团内部活动 / 周年庆 / 2024年12月 · 相册记录月</p><h1>YOU 跑团 9 周年庆</h1><p class="article-lead">跑友在户外相聚，挥动周年主题手牌，在绿荫间合影。</p><img alt="YOU 跑团 9 周年庆活动照片" decoding="async" fetchpriority="high" height="533" src="../assets/archive/675a8fb63de8bd147f0bc144-060.webp" width="800"/><div class="story-copy"><p>九周年的相册从户外开始。草地边摆开了食物和饮品，跑友们在一起聊天、休息，镜头在桌边和人群之间移动。</p><p>拍合影时，有人穿着红色团服，也有人举起写着祝福的手牌。照片记下了这次周年庆，也让平时在跑道上碰面的伙伴多了一张一起站在镜头前的合影。</p></div><img alt="YOU 跑团 9 周年庆活动照片" decoding="async" height="533" loading="lazy" src="../assets/archive/675a8fb63de8bd147f0bc144-021.webp" width="800"/><div class="archive-story-end"><p class="sub">照片及现场记录整理自跑团提供的同名相册。</p><div class="archive-back"><a class="text-link" href="../相册归档.html#group-2">浏览跑团内部活动</a><a class="text-link" href="https://www.xxpie.com/m/album?id=675a8fb63de8bd147f0bc144&amp;source=SHARE_LINK&amp;r=0863" rel="noopener noreferrer" target="_blank">打开原相册</a></div></div></article></main>
