<main id="main"><article class="wrap article-wrap"><p class="club-kicker">跑团内部活动 / 年会 / 2024年12月 · 相册记录月</p><h1>深圳 YOU 跑团 2025 年会</h1><p class="article-lead">红色年会背景板前，跑友三两成群拍照，留下跑道之外的合影。</p><img alt="深圳 YOU 跑团 2025 年会活动照片" decoding="async" fetchpriority="high" height="600" src="../assets/archive/676a6207ff3eb0684f3377b3-021.webp" width="800"/><div class="story-copy"><p>「深圳YOU跑团2025年会」印在红色背景板上，下面是熟悉的「Be a better YOU」。平时在操场集合的跑友，在年会换了个地方合影。</p><p>有人两人搭档，有人和几位朋友站成一排。同一块背景板前，留下的是不同跑友彼此熟悉的笑脸。</p></div><img alt="深圳 YOU 跑团 2025 年会活动照片" decoding="async" height="600" loading="lazy" src="../assets/archive/676a6207ff3eb0684f3377b3-001.webp" width="800"/><div class="archive-story-end"><p class="sub">照片及现场记录整理自跑团提供的同名相册。</p><div class="archive-back"><a class="text-link" href="../相册归档.html#group-2">浏览跑团内部活动</a><a class="text-link" href="https://www.xxpie.com/m/album?id=676a6207ff3eb0684f3377b3&amp;source=SHARE_LINK&amp;r=4298" rel="noopener noreferrer" target="_blank">打开原相册</a></div></div></article></main>
