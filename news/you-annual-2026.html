<main id="main"><article class="wrap article-wrap"><p class="club-kicker">跑团内部活动 / 年会 / 2026年02月 · 相册记录月</p><h1>YOU 跑团 2026 年会</h1><p class="article-lead">户外遮阳棚下摆好了点心。一张张照片记录了跑友到场、合影和相聚的时刻。</p><img alt="YOU 跑团 2026 年会活动照片" decoding="async" fetchpriority="high" height="1067" src="../assets/archive/697a10f0b31b8974362709d8-001.webp" width="800"/><div class="story-copy"><p>2026年会的相册里，有撑着遮阳棚的户外场地，也有铺着跑团桌布的点心台。跑友在桌边留影，桌上摆着不同的点心。</p><p>另一组镜头对准了相聚的跑友。从布置和食物到人像，这本相册留下了大家在训练之外聚在一起的样子。</p></div><img alt="YOU 跑团 2026 年会活动照片" decoding="async" height="1200" loading="lazy" src="../assets/archive/697a10f0b31b8974362709d8-041.webp" width="800"/><div class="archive-story-end"><p class="sub">照片及现场记录整理自跑团提供的同名相册。</p><div class="archive-back"><a class="text-link" href="../相册归档.html#group-2">浏览跑团内部活动</a><a class="text-link" href="https://www.xxpie.com/m/album?id=697a10f0b31b8974362709d8&amp;source=SHARE_LINK&amp;r=0131" rel="noopener noreferrer" target="_blank">打开原相册</a></div></div></article></main>
